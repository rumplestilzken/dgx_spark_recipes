# Recipe: Qwen3.5-397B-A17B-NVFP4
# nvidia/Qwen3.5-397B-A17B-NVFP4 model in online NVFP4 quantization

recipe_version: "1"
name: Qwen3.5-397B-A17B-NVFP4-3x
description: vLLM serving nvidia/Qwen3.5-397B-A17B-NVFP4

# HuggingFace model to download (optional, for --download-model)
model: nvidia/Qwen3.5-397B-A17B-NVFP4

# Only cluster is supported
cluster_only: true
solo_only: false

# Container image to use
# container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:latest
# container: vllm:latest
container: vllm-node-tf5

build_args:
  - --tf5

# Mod required to fix ROPE syntax error
mods:
  - mods/fix-qwen3.5-chat-template
  - mods/fix-qwen3.5-autoround
  # - mods/gpu-mem-util-gb

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  # max_model_len: 262144
  # max_num_seq: 256
  # max_num_batched_tokens: 2048
  tensor_parallel: 1
  pipeline_parallel: 3
  gpu_memory_utilization: 0.85
  # quantization: compressed-tensors
  # kv_cache_dtype: fp8
  load_format: instanttensor
  max_num_batched_tokens: 4176
  max_num_seq: 10

env:
  VLLM_USE_DEEP_GEMM: '0'
  OMP_NUM_THREADS: '3'
  VLLM_USE_FLASHINFER_SAMPLER: '0'
  VLLM_USE_FLASHINFER_MOE_FP16: '1'
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

# The vLLM serve command template
command: |
  vllm serve nvidia/Qwen3.5-397B-A17B-NVFP4  \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --enable-prefix-caching \
    -tp {tensor_parallel}  \
    -pp {pipeline_parallel} \
    --load-format {load_format} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seq {max_num_seq} \
    --distributed-executor-backend ray 
