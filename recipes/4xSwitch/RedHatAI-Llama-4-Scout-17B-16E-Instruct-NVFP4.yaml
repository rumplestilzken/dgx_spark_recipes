# Recipe: Llama-4-Scout-17B-16E-Instruct-NVFP4
# RedHatAI/Llama-4-Scout-17B-16E-Instruct-NVFP4 model in online NVFP4 quantization

recipe_version: "1"
name: Llama-4-Scout-17B-16E-Instruct-NVFP4
description: vLLM serving RedHatAI/Llama-4-Scout-17B-16E-Instruct-NVFP4

# HuggingFace model to download (optional, for --download-model)
model: RedHatAI/Llama-4-Scout-17B-16E-Instruct-NVFP4

# Only cluster is supported
cluster_only: true
solo_only: false

# Container image to use
# container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:latest
container: vllm-node-tf5

build_args:
  - --tf5

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  max_model_len: "auto"
  tensor_parallel: 4
  pipeline_parallel: 1
  gpu_memory_utilization: 0.88
  load_format: instanttensor
  max_num_batched_tokens: 2048
  max_num_seq: 32

# Environment variables
env:

# The vLLM serve command template
command: |
  vllm serve {model}  \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --kv-cache-dtype fp8 \
    --port {port} \
    --host {host} \
    --load-format {load_format} \
    -tp {tensor_parallel}  \
    -ep \
    -dcp 2 \
    --attention-backend TRITON_ATTN \
    --max-num-seq {max_num_seq} \
    --no-enable-prefix-caching \
    --compilation-config '{"pass_config":{"fuse_allreduce_rms":true,"eliminate_noops":true}}' \
    --distributed-executor-backend ray
