recipe_version: "2"
model: dealignai/DeepSeek-V4.1-Flash-UNCENSORED-FP8
runtime: sglang
container: littlecedar/dgx-spark-dsv41:canary-roce@sha256:4e5002ab58b5cca670e2624c6a0d0799642914f04487ea130c71e7f525fa9c05
min_nodes: 4

metadata:
  description: >-
    DeepSeek-V4.1-Flash-UNCENSORED-FP8 on 4x DGX Spark (GB10), SGLang, TP=4
    EP=1, DSpark k=5, 1M context, RoCEnante RDMA transport. Scratch copy of
    littlecedar's ds4 "knapcio" lane
    (recipes/ds4/deepseek-v4.1-flash-knapcio-tp4-1m-sglang.yaml) with the model
    repointed to dealignai's abliterated/uncensored FP8 repack
    (base_model: deepseek-ai/DeepSeek-V4.1-Flash). The launcher, adapters, b12x
    kernels and measurement design are upstream's (knapcio @58f2321, itself a
    downstream of MiaAI-Lab), kept under the upstream licences; the
    dsv41-sglang-overlay mod is vendored locally (mods/). Repointed copy only -
    the image/launcher were built and gated against the official checkpoint and
    this copy has NOT been booted; see README.md.
  model_url: https://huggingface.co/dealignai/DeepSeek-V4.1-Flash-UNCENSORED-FP8
  model_params: "552B"
  model_dtype: fp8
  kv_dtype: fp8
  tags: uncensored, large-context

mods:
  # Vendored copy of littlecedar/mods/dsv41-sglang-overlay (registry commit
  # e0633ed), so this recipe no longer depends on the littlecedar registry
  # being installed. Resolves adjacent to this recipe (mods/<name>); welcome
  # upstream pins/updates must be re-copied by hand.
  - dsv41-sglang-overlay

executor_config:
  entrypoint: ""
  shm_size: 32gb

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  max_model_len: 1048576
  # Serve under the *non-abliterated* id so clients/proxies/container labels are
  # identical to the official lane and nothing downstream has to learn a new
  # name. The launcher resolves the checkpoint from `{model}` (MODEL_ID), which
  # stays the abliterated repo id; served-model-name is decoupled from it.
  served_model_name: deepseek-ai/DeepSeek-V4.1-Flash

command: >
  python3 /workspace/mods/dsv41-sglang-overlay/launcher.py
  --boot
  --model {model}
  --port {port}
  --tp {tensor_parallel}
  --served-model-name {served_model_name}
  --context-length {max_model_len}

readiness:
  # inference must stay false: readiness would otherwise drive /chat/completions,
  # and the engine answers /health (with HTTP 200) from the moment the server binds.
  inference: false
  port_timeout_s: 7200
  health_timeout_s: 3600
