# Recipe: zai-org/GLM-5.3-Flash
# zai-org/GLM-5.3-Flash model in online NVFP4 quantization

recipe_version: "1"
name: zai-org/GLM-5.3-Flash
description: vLLM serving zai-org/GLM-5.3-Flash

# HuggingFace model to download (optional, for --download-model)
model: zai-org/GLM-5.3-Flash

# Only cluster is supported
cluster_only: true
solo_only: false

# runtime: vllm-ray
# runtime: trtllm

# Container image to use
# container: vllm:latest
# container: vllm-node-tf5
# conntainer: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc18

container: vllm-node-glm53-pr53906
build_args:
  - '--vllm-repo'
  - https://github.com/ZJY0516/vllm.git
  - '--vllm-ref'
  - 933876c388fb129ad82590660e6506614559cb86
  - '--flashinfer-ref'
  - 083012d6819cf97128e559616b12acb666f2fffe
  - '--torch-version'
  - 2.13.0
  - '--gpu-arch'
  - 12.1a

mods:
  # - fix-GLM-4.7-MoE
  # - fix-transformers

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  max_model_len: 262144
  # max_num_seq: 256
  # max_num_batched_tokens: 2048
  tensor_parallel: 4
  pipeline_parallel: 1
  gpu_memory_utilization: 0.85
  # quantization: compressed-tensors
  kv_cache_dtype: fp8
  # load_format: instanttensor
  max_num_batched_tokens: 8192
  max_num_seq: 128
  # expert_parallel: 4
  # quantization: compressed-tensors
  # kv_cache_dtype: fp8
  # speculative: true
  # draft_model: AngelSlim/Qwen3-1.7B_eagle3
  # num_drafts: 8
  # backend: pytorch

env:

# The vLLM serve command template
command: |
  vllm serve zai-org/GLM-5.3-Flash  \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    -tp {tensor_parallel}  \
    -pp {pipeline_parallel} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seq {max_num_seq} \
    --language-model-only \
    --moe-backend marlin \
    --enable-auto-tool-choice \
    --tool-call-parser glm47 \
    --reasoning-parser glm45 \
    -ep \
    --kv-cache-dtype {kv_cache_dtype} 