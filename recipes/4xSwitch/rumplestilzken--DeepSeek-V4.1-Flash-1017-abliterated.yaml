recipe_version: "2"
model: rumplestilzken/DeepSeek-V4.1-Flash-1017-abliterated
runtime: sglang
container: littlecedar/dgx-spark-dsv41:canary-roce-20261022@sha256:0cbe228a8788ec06472dd2dc5cd31acb117ec5ba5101f2442d32e54d2ae5b8ea
min_nodes: 4

metadata:
  description: >-
    DeepSeek-V4.1-Flash-1017 on 4x DGX Spark (GB10), SGLang, native MXFP4/F8
    checkpoint with the Engram on NVMe, TP=4 EP=1, DSpark k=5, 1M context,
    RoCEnante RDMA transport. Line-for-line sibling of
    deepseek-ai-DeepSeek-V4.1-Flash-sglang.yaml (same knapcio lane, same image
    pin, same mod, same defaults) with `model` repointed to the 2026-10-17
    refresh of the base checkpoint. The launcher, adapters, b12x kernels and
    measurement design are upstream's (knapcio @58f2321 / littlecedar's go-live
    lane, downstream of MiaAI-Lab), kept under the upstream licences.
    NOT YET BOOTED - the parent lane is the verified one (2026-10-06,
    .133-.136: 1M context served, cold 1M prefill no longer takes the head node
    down). Boot this only with the 1017 weights resident in the node HF cache
    (`refs/main` is what the launcher resolves - no revision flag).
  model_url: https://huggingface.co/rumplestilzken/DeepSeek-V4.1-Flash-1017-abliterated
  model_revision: 835db352d2c92a717473c39b2d5ff39a08362519
  model_params: "552B"
  model_dtype: mxfp4
  model_mtp_dtype: mxfp4
  kv_dtype: fp8
  tags: official, large-context, refresh-20261017, abliterated

mods:
  # Vendored from littlecedar/mods/dsv41-sglang-overlay (registry commit
  # e0633ed); same mod both v4.1f recipes use. Resolves adjacent to this
  # recipe (mods/<name>).
  - dsv41-sglang-overlay

executor_config:
  entrypoint: ""
  shm_size: 32gb

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  max_model_len: 1048576
  dspark_block_size: 5
  # Explicit and decoupled from `model`, mirroring
  # dealignai-DeepSeek-V4.1-Flash-UNCENSORED-FP8.yaml. Two intended uses:
  #   1. stock 1017  -> served_model_name: deepseek-ai/DeepSeek-V4.1-Flash-1017
  #   2. an abliterated 1017 repack -> leave `model` on the repack id and set
  #      served_model_name back to the bare `deepseek-ai/DeepSeek-V4.1-Flash`
  #      so config/proxies/container labels stay identical to today's lane.
  served_model_name: rumplestilzken/DeepSeek-V4.1-Flash-1017

command: >
  python3 /workspace/mods/dsv41-sglang-overlay/launcher.py
  --boot
  --model {model}
  --port {port}
  --tp {tensor_parallel}
  --enable-ep-moe
  --ep
  --enforce_eager=True
  --served-model-name {served_model_name}
  --context-length {max_model_len}
  --chunked-prefill-size 8192
  --max-total-tokens 2000000 
  --max-running-requests 8 
  --cuda-graph-max-bs-decode 8
env:    
  DSV41_INDEXER_LOGITS_BUDGET_BYTES: '536870912'
  # Back-to-back page scans (OCR) stack multi-thousand-token vision prefills on a
  # unified-memory node; without these caps the launcher process gets killed and
  # the lane restarts. `--max-prefill-tokens` bounds one admission batch, and
  # --mm-process-config caps each image at ~1 MP before the vision tower (pixel
  # limits alone keep the Rust preprocessing path enabled). boot.py splits this
  # on whitespace, so the JSON stays unquoted and space-free.
  # Concurrency (6), chunk size (2048) and mem fraction (0.72) are launcher
  # defaults; a text-only lane can raise them with SPARK_MAX_RUNNING_REQUESTS /
  # SPARK_CHUNKED_PREFILL_SIZE / SPARK_MEM_FRACTION_STATIC.
  EXTRA_SGLANG_ARGS: --max-prefill-tokens 8192 --mm-process-config {"image":{"max_pixels":1048576}}
readiness:
  # inference must stay false: readiness would otherwise drive /chat/completions,
  # and the engine answers /health (with HTTP 200) from the moment the server binds.
  inference: false
  port_timeout_s: 7200
  health_timeout_s: 3600