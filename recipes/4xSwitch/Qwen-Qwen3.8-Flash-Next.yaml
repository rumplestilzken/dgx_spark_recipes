# Recipe: Qwen/Qwen3.8-Flash-Next
# Qwen/Qwen3.8-Flash-Next model in online NVFP4 quantization

recipe_version: "1"
name: Qwen/Qwen3.8-Flash-Next
description: vLLM serving Qwen/Qwen3.8-Flash-Next

# HuggingFace model to download (optional, for --download-model)
model: Qwen/Qwen3.8-Flash-Next-FP8

# Only cluster is supported
cluster_only: true
solo_only: false

# runtime: vllm-ray
# runtime: vllm-distributed
# runtime: trtllm

# Container image to use
container: vllm/vllm-openai:qwen38-flash-next
# container: vllm:latest
# container: vllm-node-tf5
# conntainer: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc18

build_args:
  - --tf5

executor_config:
  entrypoint: ""

# Mod required to fix ROPE syntax error
mods:
  - fix-instanttensor
  # - mods/fix-qwen3.5-chat-template
  # - mods/fix-qwen3.5-autoround
  # - mods/gpu-mem-util-gb
  # - fix-3.8-transformers

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  pipeline_parallel: 1
  # expert_parallel: 1
  data_parallel: 1
  gpu_memory_utilization: 0.8
  # quantization: compressed-tensors
  # kv_cache_dtype: fp8
  load_format: instanttensor
  max_num_batched_tokens: 8192
  max_num_seq: 256
  # speculative: true
  # draft_model: AngelSlim/Qwen3-1.7B_eagle3
  # num_drafts: 8
  # backend: pytorch

env:

# The vLLM serve command template
command: |
  vllm serve Qwen/Qwen3.8-Flash-Next-FP8  \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --enable-prefix-caching \
    -tp {tensor_parallel}  \
    -ep \
    --load-format {load_format} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seq {max_num_seq} \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --no-enable-flashinfer-autotune