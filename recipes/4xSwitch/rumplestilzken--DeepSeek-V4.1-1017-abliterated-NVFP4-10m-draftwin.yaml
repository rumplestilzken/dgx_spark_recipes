# Recipe: rumplestilzken/DeepSeek-V4.1-1017-abliterated-NVFP4-10M @ 10M context
# ============================================================================
# DRAFT-WINDOW EXPERIMENT VARIANT -- boot deliberately, NOT the baseline.
# Identical to rumplestilzken--DeepSeek-V4.1-1017-abliterated-NVFP4-10m.yaml
# except the env sets EXTRA_SGLANG_ARGS with --speculative-draft-window-size 8192
# (see the env block at the bottom). Keeps DSpark ON; tests whether bounding the
# MTP draft window frees pool/transient memory toward a deeper turn. The
# unmodified sibling remains the measured baseline (DSpark pool 5.16M).
# ============================================================================
#
# The abliterated NVFP4 lane at a 10,485,760-token window. Sibling of
#   * rumplestilzken--DeepSeek-V4.1-Flash-1017-abliterated-nvfp4.yaml   (1M, first boot)
#   * rumplestilzken--DeepSeek-V4.1-Flash-1017-NVFP4-10m.yaml           (10M, stock NVIDIA weights)
# and byte-for-byte their launch shape except for the checkpoint and the numbers
# the 10M shape forces (below).
#
# WHAT IS DIFFERENT ABOUT THE CHECKPOINT
#   * config-carried window. The base checkpoint ships YaRN factor 16 over a
#     65,536 original window (= 1M); the repack carries factor 160 and
#     max_position_embeddings 10485760. 65,536 x 160 = 10,485,760 exactly.
#   * so this recipe passes NO rope override: the earlier design injected
#     `--json-model-override-args {"rope_scaling": …}` through EXTRA_SGLANG_ARGS
#     and relied on SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN to accept a
#     context_length above config max. Both are redundant when the checkpoint
#     itself declares the window; CONTEXT_LENGTH stays pinned explicitly.
#   * tensors are untouched by the repack (same commit as the 1M checkpoint,
#     af97f27f4d38); only config.json differs.
#
# MANDATORY FIRST RUN, per node (mods/dsv41-sglang-overlay-10m-nvfp4/prepack.sh):
#     ./prepack.sh <rank>        # rank 0..3 for spark1..spark4
# ~95 GiB/rank of FP8-expanded Engram rows, one time; the launcher refuses to boot
# a rank whose shards are absent. Pass the stock id — the packer derives the output
# path from it and the tables are not ablated, so one pack serves every recipe:
#     --model nvidia/DeepSeek-V4.1-Flash-1017-NVFP4
#
# POOL: 0.86, not the 1M lane's 0.78. The pool must hold 10,485,760 tokens x
# 1670.75 B = 17.52 GB/node plus ~1.15 GB fixed SWA state; the group-16 expert
# scale byte is +4.2 GB/node of resident constant, so 0.84 lands ~9.4M (short) and
# 0.86 restores ~11M. Host slack at 0.86 is ~18.7 GB; the NVRM OOM on the head
# node is the risk, not the OOM killer. max_running_requests 2 / decode graph 1.
#
# RISK, stated plainly: nothing here has been booted, same as both siblings.
# 10.49M is 10x past the YaRN calibration and the abliteration adds an unmeasured
# term. The 1M abliterated lane is the first boot; this recipe is the one that
# costs the live lane a restart.
#
# `model_revision`: the repack repo's own commit (main). The base commit the
# tensors come from is af97f27f4d38 — pin here once the repo commit is minted.
recipe_version: "2"
model: rumplestilzken/DeepSeek-V4.1-1017-abliterated-NVFP4
runtime: sglang
container: littlecedar/dgx-spark-dsv41:canary-roce-20261022@sha256:0cbe228a8788ec06472dd2dc5cd31acb117ec5ba5101f2442d32e54d2ae5b8ea
min_nodes: 4

metadata:
  description: >-
    DeepSeek-V4.1-Flash-1017-abliterated at a 10M (10,485,760) turn on 4x DGX
    Spark. Hybrid FP8+NVFP4 checkpoint (ModelOpt NVFP4 experts, Engram MXFP4
    expanded to FP8 on NVMe), SGLang TP=4 EP=1, DSpark k=5, fp8 KV, YaRN factor
    160 carried in config.json, 10.7M token pool, RoCEnante RDMA. Experimental,
    unbooted; the 1M abliterated lane stays the default.
  model_url: https://huggingface.co/rumplestilzken/DeepSeek-V4.1-1017-abliterated-NVFP4
  model_revision: main
  model_params: "552B"
  model_dtype: nvfp4
  model_mtp_dtype: fp8
  kv_dtype: fp8
  # Unchanged from every lane: kv_cache_quant_algo is null in this checkpoint and
  # both serve fp8 KV, so bytes_per_full_token stays 1670.75 B for this MLA
  # latent + DSA layout.
  kv_vram_per_token: 1.5560071915388107e-06   # 1670.75 B / 1024^3
  tags: 10M, long-context, experimental, nvfp4, abliterated, yarn, do-not-default

mods:
  # Fork of dsv41-sglang-overlay-10m: same launcher, plus the MXFP4 Engram patch
  # (packer + reader), the packed-shard gate, and MEM_FRACTION_STATIC 0.86.
  - dsv41-sglang-overlay-10m-nvfp4

executor_config:
  entrypoint: ""
  shm_size: 32gb
  cap_add:
    - SYS_PTRACE

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  max_model_len: 10485760
  gpu_memory_utilization: 0.86
  # Same bare id as the 1M abliterated lane: a repack keeps the served name so
  # config, proxies and container labels survive the swap.
  served_model_name: rumplestilzken/DeepSeek-V4.1-Flash

command: >
  python3 /workspace/mods/dsv41-sglang-overlay-10m-nvfp4/launcher.py
  --boot
  --model {model}
  --port {port}
  --tp {tensor_parallel}
  --enable-ep-moe
  --ep
  --enforce_eager=True
  --served-model-name {served_model_name}
  --context-length {max_model_len}
  --moe-runner-backend flashinfer_cutlass 

env:
  # --- 2026-11-10 shed stack (stage A) ---------------------------------------
  # 0.92/.93 both booted to a permanent 503 and died on the 3600 s READY
  # timeout (11-11 02:29Z): node1 carries a ~6.9 GB boot transient against a
  # 3.5 GB margin at 0.86, and each +0.01 fraction adds 1.25 GB of pool, so
  # 0.92 is ~4.5 GB underwater before init allocates. 0.90 is the measured
  # survivable ceiling; the shed stack below claws back ~2-3 GB/node of the
  # transient so the boot holds and the pool can be read against an 8M target.
  # indexer 512 -> 256 MB, engram page cache 4 -> 2 GiB, chunk 2048 -> 1024.
  # Image pinned 20261022 (0cbe228a): carries #45038 history_row clamp.
  DSV41_INDEXER_LOGITS_BUDGET_BYTES: '268435456'
  DSV41_CACHE_GIB: '2'
  # shared pack key: the tables are not ablated, one pack serves both recipes
  DSV41_ENGRAM_PACK_KEY: rumplestilzken__DeepSeek-V4.1-Flash-1017-NVFP4
  # --- 2026-11-10 stage-A pool target (from 4M ladder result) ----------
  # Raising to 0.90 grows the KV pool from 5.08M toward ~8.4M (enough for an
  # 8M turn). If the transient is flat through 2M→4M, this margin should hold
  # a ladder that reaches past 4M without OOMing node1, proving whether we can
  # push further to 0.93 (~10.7M) for the full 10,485,760 turn.
  DSV41_MEM_FRACTION: '0.90'
  DSV41_MAX_TOTAL_TOKENS: '10700000'
  # --- 2026-11-10 ladder tuning (crash at 4M, then measured) ------------------
  # Crash at 4M was a TRANSIENT GPU alloc (_memdescAllocInternal) at 2.9M depth,
  # full-attn pool only 0.67 used -- NOT pool-full, NOT earlyoom (host had 5-6 GiB
  # free, swap untouched). chunk 4096->2048 + max-run 2->1 shrink that transient.
  # SPEC_ALGO: measured BOTH ways via /get_server_info max_total_num_tokens:
  #   DSPARK on = 5,080,064  |  off = 2,498,560  (spec-OFF HALVED the pool).
  # So the earlier "draft eats the pool" guess was BACKWARDS -- MTP's accounting
  # yields the LARGER pool. DSpark stays ON. Neither reaches 10.486M at 0.86;
  # closing that gap is a mem_fraction raise + draft-window bound, NOT killing spec.
  SPEC_ALGO: 'DSPARK'
  DSV41_MAX_RUNNING_REQUESTS: '1'
  DSV41_CHUNKED_PREFILL_SIZE: '1024'
  DSV41_CUDA_GRAPH_MAX_BS_DECODE: '1'
  # --- 2026-11-10 EXPERIMENT: bound the DSpark draft's attention window --------
  # Baseline measured the DSpark pool at 5.16M (half of the 10.486M a 10M turn
  # needs). This variant keeps DSpark ON but bounds the MTP draft's window to test
  # whether that frees memory -- pool and/or the prefill transient -- without
  # killing the draft. boot.py appends EXTRA_SGLANG_ARGS to argv (boot.py:465,
  # whitespace-split), so this MUST preserve the launcher's default
  # --speculative-moe-runner-backend flashinfer_mxfp4 (the MXFP4 draft on sm121).
  # After boot, measure: /get_server_info max_total_num_tokens (pool delta?), the
  # per-node prefill memory peak (transient delta?), and decode accept-rate (does
  # the bound cost DSpark's speed?). Sweep the window 4096/8192/32768 if promising.
  EXTRA_SGLANG_ARGS: '--speculative-moe-runner-backend flashinfer_mxfp4 --speculative-draft-window-size 8192'

readiness:
  inference: false
  port_timeout_s: 7200
  health_timeout_s: 3600