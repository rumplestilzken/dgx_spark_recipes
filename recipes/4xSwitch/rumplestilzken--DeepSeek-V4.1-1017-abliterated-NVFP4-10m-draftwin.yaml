# Recipe: rumplestilzken/DeepSeek-V4.1-1017-abliterated-NVFP4-10M @ 10M context
# ============================================================================
# STAGE-B 10M LANE (formerly the "draft-window experiment" variant).
# 2026-11-16 MEASURED: --speculative-draft-window-size is a NO-OP for DSPARK —
# the engine logs "has no effect with speculative_algorithm=DSPARK (honored by
# Llama EAGLE-3 and DFLASH only)". The experiment's premise is void; the flag
# is removed and this file now simply IS the 10M lane at the stage-B fraction.
# Consequence: pool 10,380,288 @ 0.935 is the TRUE DSPARK pool, no window term.
# The unmodified sibling remains the 0.86 baseline (DSpark pool 5.16M).
# ============================================================================
#
# The abliterated NVFP4 lane at a 10,485,760-token window. Sibling of
#   * rumplestilzken--DeepSeek-V4.1-Flash-1017-abliterated-nvfp4.yaml   (1M, first boot)
#   * rumplestilzken--DeepSeek-V4.1-Flash-1017-NVFP4-10m.yaml           (10M, stock NVIDIA weights)
# and byte-for-byte their launch shape except for the checkpoint and the numbers
# the 10M shape forces (below).
#
# WHAT IS DIFFERENT ABOUT THE CHECKPOINT
#   * config-carried window. The base checkpoint ships YaRN factor 16 over a
#     65,536 original window (= 1M); the repack carries factor 160 and
#     max_position_embeddings 10485760. 65,536 x 160 = 10,485,760 exactly.
#   * so this recipe passes NO rope override: the earlier design injected
#     `--json-model-override-args {"rope_scaling": …}` through EXTRA_SGLANG_ARGS
#     and relied on SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN to accept a
#     context_length above config max. Both are redundant when the checkpoint
#     itself declares the window; CONTEXT_LENGTH stays pinned explicitly.
#   * tensors are untouched by the repack (same commit as the 1M checkpoint,
#     af97f27f4d38); only config.json differs.
#
# MANDATORY FIRST RUN, per node (mods/dsv41-sglang-overlay-10m-nvfp4/prepack.sh):
#     ./prepack.sh <rank>        # rank 0..3 for spark1..spark4
# ~95 GiB/rank of FP8-expanded Engram rows, one time; the launcher refuses to boot
# a rank whose shards are absent. Pass the stock id — the packer derives the output
# path from it and the tables are not ablated, so one pack serves every recipe:
#     --model nvidia/DeepSeek-V4.1-Flash-1017-NVFP4
#
# POOL (original 0.86 design arithmetic -- superseded by the dated env layers
# below; DSV41_MEM_FRACTION carries the live value): the pool must hold
# 10,485,760 tokens x 1670.75 B = 17.52 GB/node plus ~1.15 GB fixed SWA state;
# the group-16 expert scale byte is +4.2 GB/node of resident constant, so 0.84
# lands ~9.4M (short) and 0.86 restores ~11M. The NVRM OOM on the head node is
# the risk, not the OOM killer.
#
# STATUS (was "unbooted"; no longer true):
#   * 2026-11-10 stage A booted at 0.90 + shed stack: READY, pool 8,110,080.
#     Ladder 1M PASS, 2M PASS; 4M died on a TRANSIENT GPU alloc at ~2.9M depth
#     (pool 0.67 used -- not pool-full). Post-crash 2M probe PASS (bounded mem).
#   * 2026-11-16 stage-B boot 1 at 0.935: clean to port-bind, pool MEASURED
#     10,380,288 (105k SHORT of the 10,485,760 target); scheduler then
#     SIGTERMed by host earlyoom on a 1-second avail dip at bind+5 s (see the
#     SKIP_SMOKE layer below for the evidence). This revision: 0.9375
#     (+162k pool), earlyoom stopped for ladder runs, SKIP_SMOKE kept,
#     draft-window flag removed (DSPARK no-op, measured).
#
# `model_revision`: the repack repo's own commit (main). The base commit the
# tensors come from is af97f27f4d38 — pin here once the repo commit is minted.
recipe_version: "2"
model: rumplestilzken/DeepSeek-V4.1-1017-abliterated-NVFP4
runtime: sglang
container: littlecedar/dgx-spark-dsv41:canary-roce-20261022@sha256:0cbe228a8788ec06472dd2dc5cd31acb117ec5ba5101f2442d32e54d2ae5b8ea
min_nodes: 4

metadata:
  description: >-
    DeepSeek-V4.1-Flash-1017-abliterated at a 10M (10,485,760) turn on 4x DGX
    Spark. Hybrid FP8+NVFP4 checkpoint (ModelOpt NVFP4 experts, Engram MXFP4
    expanded to FP8 on NVMe), SGLang TP=4 EP=1, DSpark k=5, fp8 KV, YaRN factor
    160 carried in config.json, 10.7M token pool, RoCEnante RDMA. Experimental,
    unbooted; the 1M abliterated lane stays the default.
  model_url: https://huggingface.co/rumplestilzken/DeepSeek-V4.1-1017-abliterated-NVFP4
  model_revision: main
  model_params: "552B"
  model_dtype: nvfp4
  model_mtp_dtype: fp8
  kv_dtype: fp8
  # Unchanged from every lane: kv_cache_quant_algo is null in this checkpoint and
  # both serve fp8 KV, so bytes_per_full_token stays 1670.75 B for this MLA
  # latent + DSA layout.
  kv_vram_per_token: 1.5560071915388107e-06   # 1670.75 B / 1024^3
  tags: 10M, long-context, experimental, nvfp4, abliterated, yarn, do-not-default

mods:
  # Fork of dsv41-sglang-overlay-10m: same launcher, plus the MXFP4 Engram patch
  # (packer + reader), the packed-shard gate, and MEM_FRACTION_STATIC 0.86.
  - dsv41-sglang-overlay-10m-nvfp4

executor_config:
  entrypoint: ""
  shm_size: 32gb
  cap_add:
    - SYS_PTRACE

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  max_model_len: 10485760
  gpu_memory_utilization: 0.86
  # Same bare id as the 1M abliterated lane: a repack keeps the served name so
  # config, proxies and container labels survive the swap.
  served_model_name: rumplestilzken/DeepSeek-V4.1-Flash

command: >
  python3 /workspace/mods/dsv41-sglang-overlay-10m-nvfp4/launcher.py
  --boot
  --model {model}
  --port {port}
  --tp {tensor_parallel}
  --enable-ep-moe
  --ep
  --enforce_eager=True
  --served-model-name {served_model_name}
  --context-length {max_model_len}
  --moe-runner-backend flashinfer_cutlass 

env:
  # --- 2026-11-10 shed stack (stage A) ---------------------------------------
  # 0.92/.93 both booted to a permanent 503 and died on the 3600 s READY
  # timeout (11-11 02:29Z): node1 carries a ~6.9 GB boot transient against a
  # 3.5 GB margin at 0.86, and each +0.01 fraction adds 1.25 GB of pool, so
  # 0.92 is ~4.5 GB underwater before init allocates. 0.90 is the measured
  # survivable ceiling; the shed stack below claws back ~2-3 GB/node of the
  # transient so the boot holds and the pool can be read against an 8M target.
  # indexer 512 -> 256 MB, engram page cache 4 -> 2 GiB (11-16: 2 -> 1 GiB,
  # +1 GiB/node host slack toward the raise), chunk 2048 -> 1024.
  # Image pinned 20261022 (0cbe228a): carries #45038 history_row clamp.
  DSV41_INDEXER_LOGITS_BUDGET_BYTES: '268435456'
  DSV41_CACHE_GIB: '1'
  # shared pack key: the tables are not ablated, one pack serves both recipes
  DSV41_ENGRAM_PACK_KEY: rumplestilzken__DeepSeek-V4.1-Flash-1017-NVFP4
  # --- 2026-11-10 stage-A pool target (from 4M ladder result) ----------
  # Raising to 0.90 grows the KV pool from 5.08M toward ~8.4M (enough for an
  # 8M turn). If the transient is flat through 2M→4M, this margin should hold
  # a ladder that reaches past 4M without OOMing node1, proving whether we can
  # push further toward the full 10,485,760 turn.
  # --- 2026-11-16 stage B: fraction for the 10M turn ---------------------------
  # Stage A MEASURED: READY at 0.90, pool (max_total_num_tokens) = 8,110,080.
  # Stage-B boot 1 at 0.935 MEASURED pool = 10,380,288 — 105,472 SHORT of the
  # 10,485,760 target (the manifest's 10,485,248-token prompt alone exceeds it).
  # True slope (8,110,080 @ 0.90 -> 10,380,288 @ 0.935) = ~64.9k tokens per
  # +0.001 fraction (the earlier 757.5k/0.01 projection from the 0.86 point was
  # optimistic). 0.9375 -> +162k -> ~10,542k >= target (+57k margin), still
  # under the 10.7M MAX_TOTAL pin. Host steady slack at 0.935 measured ~5.0
  # GiB/node at READY; 0.9375 costs ~0.3 GiB more. CACHE_GIB note: env delivers
  # 1 but the Engram reader reports cache=2.0GiB (reader-side clamp/format);
  # the trim's host saving did not materialize — left at 1, harmless.
  # --- 2026-11-16 (evening) step DOWN to 0.93 after the full-stack crash ------
  # 0.9375 with earlyoom stopped = node-fatal: the pool first-touch at the
  # health transition exhausted the head node's host slack (NVRM
  # _memdescAllocInternal flood on all ranks), 133 wedged off the network,
  # full stack crashed, all four physically rebooted. Boot 1's "1-s transient"
  # was earlyoom SAVING the node — the kill freed the RSS that let avail
  # recover. CONSTRAINT REFRAMED: host slack (1-f)x121 GB vs a ~5-7 GB
  # first-touch transient. 0.90 (12.1 GB) proven clean; 0.935 (7.9 GB) died by
  # shed; 0.9375 unprotected killed the node. The full 10,485,760 pool is
  # UNREACHABLE by fraction on 121 GB nodes. New plan: 0.93 (8.5 GB slack)
  # WITH earlyoom armed (a shed = recoverable probe failure), expected pool
  # ~10.0M; top ladder rung trims to realized pool x ~0.97. Wedge-proofing
  # now on every node: min_free_kbytes=1GiB, oom_kill_allocating_task=1,
  # SBSA hardware watchdog 60 s via systemd (see port doc).
  # --- 2026-11-16 boot 5 (0.93, fresh cluster) -> step to 0.915 ----------------
  # 0.93 measured: pool 8,775,680 (BELOW 0.935's warm-state 10,380,288 — the
  # pool is STATE-DEPENDENT: the engine samples free unified memory at init,
  # and a fresh-booted cluster carries a different baseline than the warm
  # pre-crash one). Bind+28 s: earlyoom shed the scheduler as ALL FOUR nodes
  # squeezed to 1-3 GiB — the first-touch is the KV pool itself COMMITTING
  # host pages (unified memory). Nodes all survived; safety stack validated.
  # Steady-avail model: ~5.3 GiB at 0.90 minus ~1.2 GB per +0.01 -> no-shed
  # ceiling ~0.92; 0.915 predicts ~3.5-4 GiB steady, clear of earlyoom's
  # 2.4 GiB line. Top ladder rung = realized pool x ~0.97, read per boot.
  DSV41_MEM_FRACTION: '0.915'
  DSV41_MAX_TOTAL_TOKENS: '10700000'
  # --- 2026-11-10 ladder tuning (crash at 4M, then measured) ------------------
  # Crash at 4M was a TRANSIENT GPU alloc (_memdescAllocInternal) at 2.9M depth,
  # full-attn pool only 0.67 used -- NOT pool-full, NOT earlyoom (host had 5-6 GiB
  # free, swap untouched). chunk 4096->2048 + max-run 2->1 shrink that transient.
  # SPEC_ALGO: measured BOTH ways via /get_server_info max_total_num_tokens:
  #   DSPARK on = 5,080,064  |  off = 2,498,560  (spec-OFF HALVED the pool).
  # So the earlier "draft eats the pool" guess was BACKWARDS -- MTP's accounting
  # yields the LARGER pool. DSpark stays ON. Neither reaches 10.486M at 0.86;
  # closing that gap is a mem_fraction raise, NOT killing spec.
  SPEC_ALGO: 'DSPARK'
  DSV41_MAX_RUNNING_REQUESTS: '1'
  DSV41_CHUNKED_PREFILL_SIZE: '1024'
  DSV41_CUDA_GRAPH_MAX_BS_DECODE: '1'
  # --- 2026-11-16 SKIP_SMOKE (kept) + the REAL post-ready killer: earlyoom -----
  # smoke() was the prime suspect (un-trapped in serve(); asserts + timeout=600
  # -> finally -> stop() -> killpg SIGTERM). DISPROVEN as the trigger on the
  # first stage-B boot: with SKIP_SMOKE=1 active the scheduler was STILL
  # SIGTERMed 5 s after port-bind, with /health still 503 (smoke never ran).
  # journalctl spark-a669 17:27:21 EST: "low memory! at or below SIGTERM
  # limits: mem 2.00%" -> "sending SIGTERM to ... sglang::schedul (badness
  # 984)" on a ONE-SECOND avail dip 5,011 -> 2,300 -> 6,145 MiB (KV pool
  # first-touch at port-bind). earlyoom (-m 2 -s 80 --prefer sglang|python;
  # the swap-free<80% gate stays armed once swap use exceeds ~6.3 GiB during
  # weight load) is the post-ready killer of 11-10 and plausibly the .92/.93
  # init deaths too. MITIGATION for ladder runs: systemctl stop earlyoom on
  # all 4 nodes (node-guard.sh keeps real-OOM cover: sustained 2 GiB floor
  # x 2 samples, hung-task/Xid -> docker stop). RESTORE earlyoom after the
  # run. SKIP_SMOKE stays: it removes a real failure class (the native-vision
  # assert has no place on a text ladder) and is how the kill was isolated.
  SKIP_SMOKE: '1'
  # --- 2026-11-16 draft backend only (window flag removed as measured no-op) ---
  # boot.py appends EXTRA_SGLANG_ARGS to argv (boot.py:465, whitespace-split);
  # this preserves the launcher's default --speculative-moe-runner-backend
  # flashinfer_mxfp4 (the MXFP4 draft on sm121). --speculative-draft-window-size
  # was removed: the engine logs it "has no effect with
  # speculative_algorithm=DSPARK (honored by Llama EAGLE-3 and DFLASH only)".
  # --- 2026-11-22 (Quill, Nick's order): attn_cp_size=2 — the 10M lever -----------
  # The replicated MLA latent is the whole per-node KV cost. attn_cp=2 shards it
  # across a rank pair (tp4 -> 2x attn-CP groups), ~halving per-node KV so the pool
  # ~doubles at the same 0.915 (6.45M measured DSPARK-on -> target ~11-12M, clears
  # 10,485,760). dsv4 implements it (attn_cp_metadata) and Engram hash_ids are
  # already sharded by attn_cp_rank::attn_cp_size. KEEP DSPARK: measured spec-OFF
  # SHRINKS the pool (6.45M->4.81M @0.915), and the CP-vs-spec conflicts are all
  # fenced behind DP-attention / PD-disaggregation, neither of which this lane runs.
  # UNTESTED combo (attn_cp + dsv4 + Engram + DSPARK + b12x) — boot-only risk.
  # Fallback if it trips: drop '--attn-cp-size 2' -> the proven 6.45M DSPARK lane.
  EXTRA_SGLANG_ARGS: '--speculative-moe-runner-backend flashinfer_mxfp4 --attn-cp-size 2'

readiness:
  inference: false
  port_timeout_s: 7200
  health_timeout_s: 3600
