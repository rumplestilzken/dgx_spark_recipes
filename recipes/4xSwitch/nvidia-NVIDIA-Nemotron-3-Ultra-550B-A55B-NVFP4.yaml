# Recipe: NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
# nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4 model in online NVFP4 quantization

recipe_version: "1"
name: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
description: vLLM serving nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4

# HuggingFace model to download (optional, for --download-model)
model: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4

# Only cluster is supported
cluster_only: true
solo_only: false

# runtime: vllm-ray
# runtime: trtllm

# Container image to use
# container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:latest
# container: vllm:latest
container: vllm-node-tf5
# conntainer: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc18

build_args:
  - --tf5

mods:

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  # max_model_len: 262144
  # max_num_seq: 256
  # max_num_batched_tokens: 2048
  tensor_parallel: 4
  pipeline_parallel: 1
  gpu_memory_utilization: 0.85
  # quantization: compressed-tensors
  # kv_cache_dtype: fp8
  load_format: instanttensor
  max_num_batched_tokens: 2048
  max_num_seq: 128
  expert_parallel: 4
  # speculative: true
  # draft_model: AngelSlim/Qwen3-1.7B_eagle3
  # num_drafts: 8
  # backend: pytorch

env:

# The vLLM serve command template
command: |
  vllm serve nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4  \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --enable-prefix-caching \
    -tp {tensor_parallel}  \
    -pp {pipeline_parallel} \
    --load-format {load_format} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seq {max_num_seq} \
    --language-model-only \
    --tool-call-parser qwen3_coder \
    --enable-auto-tool-choice \
    --distributed-executor-backend ray