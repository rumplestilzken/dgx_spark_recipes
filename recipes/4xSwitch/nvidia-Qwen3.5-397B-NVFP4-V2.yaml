# Recipe: Qwen3.5-397B-A17B-NVFP4-V2
# nvidia/Qwen3.5-397B-A17B-NVFP4-V2 model in online NVFP4 quantization

recipe_version: "1"
name: nvidia/Qwen3.5-397B-A17B-NVFP4-V2
description: vLLM serving nvidia/Qwen3.5-397B-A17B-NVFP4

# HuggingFace model to download (optional, for --download-model)
model: nvidia/Qwen3.5-397B-A17B-NVFP4-V2

# Only cluster is supported
cluster_only: true
solo_only: false

# runtime: vllm-ray
# runtime: vllm-distributed
# runtime: trtllm

# Container image to use
# container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:latest
# container: vllm:latest
container: vllm-node-tf5
# conntainer: nvcr.io/nvidia/tensorrt-llm/release:1.3.0rc18

build_args:
  - --tf5

# Mod required to fix ROPE syntax error
mods:
  - mods/fix-qwen3.5-chat-template
  - mods/fix-qwen3.5-autoround
  # - mods/gpu-mem-util-gb

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  pipeline_parallel: 1
  # expert_parallel: 1
  data_parallel: 1
  gpu_memory_utilization: 0.85
  # quantization: compressed-tensors
  # kv_cache_dtype: fp8
  load_format: instanttensor
  max_num_batched_tokens: 8192
  max_num_seq: 256
  # speculative: true
  # draft_model: AngelSlim/Qwen3-1.7B_eagle3
  # num_drafts: 8
  # backend: pytorch

env:

# The vLLM serve command template
command: |
  vllm serve nvidia/Qwen3.5-397B-A17B-NVFP4-V2  \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --enable-prefix-caching \
    -tp {tensor_parallel}  \
    --load-format {load_format} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seq {max_num_seq} \
    --kv-cache-dtype fp8 \
    --reasoning-parser qwen3 \
    --chat-template unsloth.jinja \
    --speculative-config '{"method":"mtp","num_speculative_tokens":5}'