# Recipe: Qwen3.5-397B-A17B-NVFP4
# nvidia/Qwen3.5-397B-A17B-NVFP4 model in online NVFP4 quantization

recipe_version: "1"
name: meta-llama/Llama-4-Scout-17B-16E
description: vLLM serving meta-llama/Llama-4-Scout-17B-16E

# HuggingFace model to download (optional, for --download-model)
model: meta-llama/Llama-4-Scout-17B-16E

# Only cluster is supported
cluster_only: true
solo_only: false

# Container image to use
# container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:latest
# container: vllm:latest
container: vllm-node-tf5

build_args:
  - --tf5

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  # max_model_len: 262144
  # max_num_seq: 256
  # max_num_batched_tokens: 2048
  tensor_parallel: 1
  pipeline_parallel: 3
  gpu_memory_utilization: 0.8
  # quantization: compressed-tensors
  # kv_cache_dtype: fp8
  load_format: instanttensor
  max_num_batched_tokens: 4176
  max_num_seq: 10

# Environment variables
env:
  # VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: 0
  # PYTORCH_CUDA_ALLOC_CONF: "expands

# The vLLM serve command template
command: |
  vllm serve meta-llama/Llama-4-Scout-17B-16E \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --enable-prefix-caching \
    -tp {tensor_parallel}  \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seq {max_num_seq} \
    --distributed-executor-backend ray 
