# Recipe: Meta-Llama-3.1-405B-FP8
# RedHatAI/Meta-Llama-3.1-405B-FP8 model in online NVFP4 quantization

recipe_version: "1"
name: RedHatAI/Meta-Llama-3.1-405B-FP8
description: vLLM serving RedHatAI/Meta-Llama-3.1-405B-FP8

# HuggingFace model to download (optional, for --download-model)
model: RedHatAI/Meta-Llama-3.1-405B-FP8

# Only cluster is supported
cluster_only: true
solo_only: false

# Container image to use
# container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:latest
# container: vllm:latest
container: vllm-node-tf5

build_args:
  - --tf5

# Default settings (can be overridden via CLI)
defaults:
  port: 8000
  host: 0.0.0.0
  # max_model_len: 262144
  # max_num_seq: 256
  # max_num_batched_tokens: 2048
  tensor_parallel: 3
  pipeline_parallel: 1
  gpu_memory_utilization: 0.85
  # quantization: compressed-tensors
  # kv_cache_dtype: fp8
  load_format: instanttensor
  max_num_batched_tokens: 2048
  max_num_seq: 2

# Environment variables
env:
  # VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: 0
  # PYTORCH_CUDA_ALLOC_CONF: "expands

# The vLLM serve command template
command: |
  vllm serve nvidia/Qwen3.5-397B-A17B-NVFP4  \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --port {port} \
    --host {host} \
    --enable-prefix-caching \
    -tp {tensor_parallel}  \
    -pp {pipeline_parallel} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seq {max_num_seq} \
    --distributed-executor-backend ray 
